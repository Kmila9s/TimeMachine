include:
  - project: 'kmila-9s/ci-templates'
    file: '/auto-merge.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/release.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/commit-guard.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/downstream-fanout.yml'

stages:
  - test
  - merge
  - release
  - fanout
unit-test:
    stage: test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    script:
      - dotnet run -c Release -f net10.0 -p:TargetFrameworks=net10.0